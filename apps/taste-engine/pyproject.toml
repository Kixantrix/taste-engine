[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "taste-engine"
version = "0.1.0"
description = "Local-first household taste engine"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.8.1",
    "SQLAlchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
strict = true
