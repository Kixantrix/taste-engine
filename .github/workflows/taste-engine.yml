name: taste-engine

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: taste-engine-python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taste_engine
          POSTGRES_USER: taste_engine
          POSTGRES_PASSWORD: local-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taste_engine -d taste_engine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://localhost:5432/taste_engine
      PGUSER: taste_engine
      PGPASSWORD: local-dev-password
      AUTH_MODE: passphrase
      PUBLIC_BASE_URL: http://localhost:8000
      CATALOG_USER_AGENT: taste-engine-ci/0.1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: python -m pip install -e 'apps/taste-engine[dev]'

      - name: Lint
        run: ruff check apps/taste-engine

      - name: Type check
        working-directory: apps/taste-engine
        run: mypy src

      - name: Apply migrations
        working-directory: apps/taste-engine
        run: alembic upgrade head

      - name: Test
        working-directory: apps/taste-engine
        run: pytest tests -q

  web:
    name: taste-engine-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -C apps/taste-engine/web lint

      - name: Type check
        run: pnpm -C apps/taste-engine/web typecheck

      - name: Test and build
        run: |
          pnpm -C apps/taste-engine/web test
          pnpm -C apps/taste-engine/web build

  compose-smoke:
    name: taste-engine-compose-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and start Compose stack
        run: docker compose -f apps/taste-engine/compose.yaml up -d --build --wait

      - name: Exercise deployed endpoints
        env:
          TASTE_SMOKE_BASE_URL: http://localhost:8000
        run: bash scripts/smoke.sh

      - name: Stop Compose stack
        if: always()
        run: docker compose -f apps/taste-engine/compose.yaml down -v

  publish:
    name: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python
      - web
      - compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -f apps/taste-engine/Dockerfile -t taste-engine .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push image
        env:
          IMAGE: ghcr.io/kixantrix/taste-engine
        run: |
          docker tag taste-engine "$IMAGE:$GITHUB_SHA"
          docker tag taste-engine "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
