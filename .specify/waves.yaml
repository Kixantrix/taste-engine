#   OPS-01 (#14) -> apps/taste-engine/**, .github/workflows/taste-engine.yml, scripts/smoke.*
#   DISC-02 (#2) -> specs/projects/taste-engine/research/**, research.md (§Data/§Upstream lines)
# Disjoint -> wave 1 runs both. CORE-01 (#6) builds on the OPS-01 skeleton -> wave 2.
# Local/human tasks (DISC-01 #1, DISC-03 #3, DISC-05 #5, DISC-06) run alongside, not dispatched.
# DISC-04 (#4) waits on vendor API keys in the `copilot` environment.
taste_engine_waves:
